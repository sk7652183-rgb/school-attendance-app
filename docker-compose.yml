version: "3.8"
services:
  frontend:
    build: ./frontend
    container_name: school-attendance-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
    container_name: school-attendance-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    command: sh -c "node seedAdmin.js && node server.js"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: attendance-mangodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
